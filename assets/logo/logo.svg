<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(20.480000000000018 20.480000000000018) scale(0.96)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo"><rect x="-170" y="-230" width="340" height="360" rx="26"/></clipPath>
  </defs>
  <!-- back card: delete -->
  <g transform="translate(410 520) rotate(-14)" filter="url(#shadow)">
    <rect x="-200" y="-260" width="400" height="520" rx="48" fill="#EF4444"/>
    <g stroke="#fff" stroke-width="34" stroke-linecap="round" opacity="0.95">
      <line x1="-120" y1="-180" x2="-50" y2="-110"/><line x1="-50" y1="-180" x2="-120" y2="-110"/>
    </g>
  </g>
  <!-- front card: keep -->
  <g transform="translate(600 500) rotate(10)" filter="url(#shadow)">
    <rect x="-200" y="-260" width="400" height="520" rx="48" fill="#FFFFFF"/>
    <g clip-path="url(#photo)">
      <rect x="-170" y="-230" width="340" height="360" fill="url(#sky)"/>
      <circle cx="80" cy="-130" r="46" fill="#FCD34D"/>
      <path d="M-200 130 L-80 -40 L10 60 L70 0 L200 130 Z" fill="#6366F1"/>
      <path d="M-200 130 L-110 20 L-20 130 Z" fill="#4338CA"/>
    </g>
    <rect x="-170" y="160" width="220" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="-170" y="205" width="140" height="22" rx="11" fill="#E5E7EB"/>
  </g>
  <!-- keep badge -->
  <g transform="translate(790 300)">
    <circle r="96" fill="#22C55E" stroke="#fff" stroke-width="16"/>
    <path d="M-44 2 L-12 36 L48 -30" fill="none" stroke="#FFFFFF" stroke-width="30"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
</svg>