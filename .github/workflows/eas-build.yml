name: EAS Build

on:
  # Every merge to main produces an installable Android APK.
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/logo/**'
  # Manual runs from the Actions tab can pick any platform and profile.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: Build profile from eas.json
        type: choice
        default: preview
        options:
          - preview
          - production
          - development

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Build on EAS
        run: >-
          eas build
          --platform ${{ inputs.platform || 'android' }}
          --profile ${{ inputs.profile || 'preview' }}
          --non-interactive
          --no-wait
